<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compliance Empire</title>
<meta name="theme-color" content="#1b130c">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("empire-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Special+Elite&family=Karla:wght@400;600;700&display=swap">
<style>
  /* Paper on a desk. Only the desk changes between themes — paper stays paper. */
  :root {
    --desk: #d6c4a2;
    --grain: rgba(0,0,0,.06);
    --desk-fg: #2e2519;
    --desk-muted: #6b5d46;
    --slip: #fbf7ec;
    --slip-fg: #221c14;
    --slip-muted: #6d6353;
    --brass: #d9b03c;
    --brass-hi: #f0cf6b;
    --brass-lo: #a47c1c;
    --brass-deep: #7d5d12;
    --brass-fg: #1a1204;
    --stamp: #b3261e;
    --lift: rgba(70,52,28,.34);
    --radius: 10px;
    --display: "Bungee", "Karla", sans-serif;
    --body: "Karla", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --desk: #1b130c;
    --grain: rgba(0,0,0,.24);
    --desk-fg: #f4efe2;
    --desk-muted: #a08f74;
    --slip: #efe7d3;
    --lift: rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; color: var(--desk-fg); font-family: var(--body);
    background: var(--desk);
    background-image: repeating-linear-gradient(92deg, var(--grain) 0 2px, transparent 2px 9px);
    min-height: 100%; min-height: 100dvh;
    display: flex; flex-direction: column;
    overflow-y: auto; overscroll-behavior: none;
  }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; user-select: none; }

  /* ---- the engraved nameplate ---- */
  header { padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
  .plate {
    display: flex; align-items: center; gap: 11px;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
    color: var(--brass-fg); border-radius: 8px; padding: 10px 10px 10px 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 5px 14px var(--lift);
  }
  .plate > svg { width: 24px; height: 24px; flex: none; }
  .plate h1 { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.15; }
  .plate .sub { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: .68; margin-top: 1px; }
  .plate .grow { flex-grow: 1; min-width: 0; }
  .plate button {
    background: none; border: 0; color: var(--brass-fg); opacity: .74;
    font-size: 11px; letter-spacing: 1px; padding: 9px 7px; cursor: pointer;
  }
  #themeBtn { font-size: 16px; }

  /* ---- the balance, clipped to the desk ---- */
  .bank { padding: 18px 16px 0; }
  .slip {
    position: relative; background: var(--slip); color: var(--slip-fg);
    border-radius: 3px; padding: 16px 18px;
    box-shadow: 0 10px 24px var(--lift);
  }
  .clip {
    position: absolute; top: -9px; left: 24px; width: 46px; height: 17px; border-radius: 3px;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 6px var(--lift);
  }
  .cap { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--slip-muted); }
  .money { font-family: var(--display); font-size: clamp(29px, 8.5vw, 38px); line-height: 1.3; margin-top: 2px; }
  .money .cur { font-family: var(--body); font-weight: 700; font-size: .72em; margin-right: 3px; }
  .rate { font-size: 12px; color: var(--slip-muted); }
  .stamp {
    position: absolute; right: 12px; top: 22px; width: 72px; height: 72px;
    color: var(--stamp); opacity: .8; transform: rotate(-12deg);
  }

  #fileBtn {
    margin-top: 16px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 50%, var(--brass-lo));
    color: var(--brass-fg); border: 0; border-radius: var(--radius); padding: 16px;
    font-family: var(--display); font-size: 15px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 5px 0 var(--brass-deep), 0 10px 20px var(--lift);
  }
  #fileBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 2px 0 var(--brass-deep);
  }
  #fileBtn svg { width: 23px; height: 23px; flex: none; }
  #fileBtn small { font-family: var(--body); font-size: 12px; font-weight: 700; opacity: .78; }

  /* ---- two stacks of paper on the desk ---- */
  main { flex-grow: 1; display: grid; padding: 4px 16px 0; }
  @media (min-width: 760px) { main { grid-template-columns: 1fr 1fr; gap: 24px; } }
  .panel { padding: 14px 0 8px; }
  .panel h2 {
    margin: 0 0 10px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--desk-muted); display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .modes { display: flex; gap: 4px; }
  .modes button {
    background: var(--slip); border: 0; border-radius: 6px; color: var(--slip-muted);
    font-size: 11px; font-weight: 700; padding: 7px 10px; cursor: pointer; letter-spacing: 0;
    box-shadow: 0 2px 5px var(--lift);
  }
  .modes button[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); color: var(--brass-fg);
  }

  /* a hire and its manager sit side by side; a button inside a button works in neither */
  .rowwrap { display: flex; gap: 6px; margin-bottom: 8px; }
  .row {
    display: flex; flex-grow: 1; min-width: 0; align-items: center; gap: 11px; text-align: left;
    background: var(--slip); color: var(--slip-fg); border: 0; border-radius: 3px;
    padding: 9px 11px; cursor: pointer; min-height: 58px;
    box-shadow: 0 5px 12px var(--lift);
  }
  .row:disabled { cursor: default; box-shadow: 0 2px 6px var(--lift); }
  .row:disabled .chip { filter: grayscale(.6); opacity: .8; }
  .row:disabled .name, .row:disabled .desc { opacity: .74; }
  .row:disabled .cost { opacity: .45; }
  .chip {
    width: 38px; height: 38px; flex: none; border-radius: 7px;
    background: linear-gradient(180deg, var(--brass), var(--brass-lo)); color: var(--brass-fg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
  }
  .chip svg { width: 21px; height: 21px; }
  .row .grow { display: block; flex-grow: 1; min-width: 0; }
  .row .name { display: block; font-size: 13px; font-weight: 700; }
  .row .name b { color: var(--brass-lo); }
  .row .desc { display: block; font-size: 10.5px; color: var(--slip-muted); margin-top: 2px; line-height: 1.35; }
  .row .num { display: block; text-align: right; flex: none; }
  .row .cost { display: block; font-family: var(--display); font-size: 14px; white-space: nowrap; }
  .row .each { display: block; font-size: 10px; color: var(--slip-muted); margin-top: 3px; white-space: nowrap; }

  .auto {
    flex: none; width: 56px; border: 0; border-radius: 3px; cursor: pointer;
    background: var(--slip); color: var(--slip-muted);
    font-size: 9px; font-weight: 700; letter-spacing: 1px; line-height: 1.6; padding: 4px 2px;
    box-shadow: 0 5px 12px var(--lift);
  }
  .auto b { display: block; font-size: 10px; }
  .auto.on { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); color: var(--brass-fg); }
  .auto:disabled { cursor: default; box-shadow: 0 2px 6px var(--lift); opacity: .8; }
  .auto:disabled:not(.on) { color: color-mix(in srgb, var(--slip-muted) 55%, transparent); }
  .empty { font-size: 12px; color: var(--desk-muted); padding: 4px 0 10px; }

  footer {
    padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between;
  }
  #mergeBtn {
    background: none; border: 1px solid var(--brass-lo); color: var(--desk-fg);
    border-radius: var(--radius); padding: 12px 15px;
    font-family: var(--display); font-size: 12px; cursor: pointer;
  }
  #mergeBtn:disabled { opacity: .45; cursor: default; border-color: var(--desk-muted); }
  footer .stats { font-size: 10.5px; color: var(--desk-muted); line-height: 1.6; }
  footer .stats b { color: var(--brass); }
  #wipeBtn { background: none; border: 0; cursor: pointer; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--slip-fg); color: var(--slip); padding: 12px 16px; border-radius: 6px;
    font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none;
    transition: opacity 150ms; z-index: 10; max-width: 90vw; box-shadow: 0 8px 20px var(--lift);
  }
  #toast.show { opacity: 1; }

  dialog {
    border: 0; border-radius: 4px; background: var(--slip); color: var(--slip-fg);
    font-family: inherit; max-width: 330px; width: 90%; padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.55);
  }
  dialog::backdrop { background: rgba(20,14,6,.62); }
  dialog h2 { margin: 0 0 12px; font-family: var(--display); font-size: 15px; }
  dialog p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: var(--slip-muted); }
  dialog .big { font-family: var(--display); font-size: 30px; color: var(--slip-fg); margin: 6px 0 10px; }
  dialog button {
    margin-top: 14px; width: 100%; border: 0; border-radius: var(--radius); padding: 14px;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 50%, var(--brass-lo));
    color: var(--brass-fg); font-family: var(--display); font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 4px 0 var(--brass-deep);
  }
</style>
</head>
<body>

<header>
  <div class="plate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 20h16"></path><path d="M6 20V9l6-4 6 4v11"></path><path d="M10 20v-5h4v5"></path>
    </svg>
    <div class="grow">
      <h1>Compliance Empire</h1>
      <div class="sub">Practice &amp; Co.</div>
    </div>
    <button id="themeBtn" type="button">&#x25d0;</button>
    <button id="wipeBtn" type="button">Reset</button>
  </div>
</header>

<section class="bank">
  <div class="slip">
    <span class="clip"></span>
    <div class="cap">Fees received</div>
    <div class="money"><span class="cur">&#8377;</span><span id="money">0</span></div>
    <div class="rate" id="rate">&#8377;0 per second</div>
    <svg class="stamp" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
      <circle cx="50" cy="50" r="44"></circle>
      <circle cx="50" cy="50" r="36" stroke-dasharray="4 3"></circle>
      <text x="50" y="45" text-anchor="middle" font-family="Special Elite, cursive" font-size="17" fill="currentColor" stroke="none">FILED</text>
      <text x="50" y="63" text-anchor="middle" font-family="Special Elite, cursive" font-size="10" fill="currentColor" stroke="none">CE-1</text>
    </svg>
  </div>
  <button id="fileBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3h8v5H8z"></path><path d="M6 8h12l1 5H5z"></path><path d="M4 16h16v4H4z"></path>
    </svg>
    <span>File a return <small id="perClick">+&#8377;1</small></span>
  </button>
</section>

<main>
  <section class="panel">
    <h2>Staff on roll
      <span class="modes">
        <button type="button" data-mode="1" aria-pressed="true">&times;1</button>
        <button type="button" data-mode="10" aria-pressed="false">&times;10</button>
        <button type="button" data-mode="max" aria-pressed="false">Max</button>
      </span>
    </h2>
    <div id="gens"></div>
  </section>
  <section class="panel">
    <h2>Upgrades</h2>
    <div id="ups"></div>
  </section>
</main>

<footer>
  <button id="mergeBtn" type="button">Merge with a bigger firm</button>
  <div class="stats" id="stats"></div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="away">
  <h2>While you were out</h2>
  <p>The office kept filing.</p>
  <p class="big" id="awayAmount">&#8377;0</p>
  <p id="awayFor"></p>
  <button id="awayBtn" type="button">Back to work</button>
</dialog>

<script>
/* ---------------------------------------------------------------- content */

const GROWTH = 1.15;

const GENS = [
  { id: "clerk",   name: "Article Clerk",       desc: "Files what you tell them to. Eventually.",  cost: 15,       rate: 0.1 },
  { id: "para",    name: "Paralegal",           desc: "Knows which form is which.",                cost: 110,      rate: 1 },
  { id: "cs",      name: "Company Secretary",   desc: "Signs off without reading. Mostly.",        cost: 1200,     rate: 8 },
  { id: "branch",  name: "Branch Office",       desc: "A second address, a second rubber stamp.",  cost: 13000,    rate: 47 },
  { id: "soft",    name: "Filing Software",     desc: "Times out less often than the portal.",     cost: 140000,   rate: 260 },
  { id: "partner", name: "Partner",             desc: "Brings clients. Takes a cut regardless.",   cost: 2000000,  rate: 1400 },
  { id: "cal",     name: "Compliance Calendar", desc: "Files everything before you wake up.",      cost: 33000000, rate: 7800 }
];

/* A manager buys its tier for you, forever. Priced well past the tier itself. */
const managerCost = g => g.cost * 120;

const ICONS = {
  clerk:   '<circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"></path>',
  para:    '<path d="M3 7h6l2 2.5h10V19H3z"></path><path d="M3 11h18"></path>',
  cs:      '<circle cx="12" cy="9" r="5"></circle><path d="M9 13.6L8 21l4-2 4 2-1-7.4"></path>',
  branch:  '<path d="M4 20h16"></path><path d="M6 20V8l6-3.5L18 8v12"></path><path d="M10 20v-5h4v5"></path>',
  soft:    '<rect x="3" y="5" width="18" height="12" rx="1.5"></rect><path d="M9 21h6"></path><path d="M12 17v4"></path>',
  partner: '<path d="M3 8h18v11H3z"></path><path d="M9 8V5h6v3"></path><path d="M3 13h18"></path>',
  cal:     '<rect x="3" y="5" width="18" height="16" rx="1.5"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path>',
  up:      '<path d="M12 19V6"></path><path d="M6 12l6-6 6 6"></path>'
};
const icon = key => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[key] + '</svg>';

/* need: [what, howMany] — a generator id, or "click" for times clicked. */
const UPGRADES = [
  { id: "c1", name: "Two-finger typing",  desc: "Filing by hand pays double.",        cost: 120,        target: "click",   need: ["click", 15],   mult: 2 },
  { id: "c2", name: "Keyboard shortcuts", desc: "Filing by hand pays double again.",  cost: 3000,       target: "click",   need: ["click", 100],  mult: 2 },
  { id: "c3", name: "Pre-filled forms",   desc: "And once more, for the wrist.",      cost: 90000,      target: "click",   need: ["click", 400],  mult: 3 },

  { id: "g1", name: "Standing desks",     desc: "Article clerks work twice as fast.", cost: 200,        target: "clerk",   need: ["clerk", 10],   mult: 2 },
  { id: "g2", name: "Actual training",    desc: "Article clerks, doubled.",           cost: 4500,       target: "clerk",   need: ["clerk", 25],   mult: 2 },
  { id: "g3", name: "A real library",     desc: "Paralegals, doubled.",               cost: 1300,       target: "para",    need: ["para", 10],    mult: 2 },
  { id: "g4", name: "Precedent bank",     desc: "Paralegals, doubled.",               cost: 26000,      target: "para",    need: ["para", 25],    mult: 2 },
  { id: "g5", name: "Digital signatures", desc: "Secretaries, doubled.",              cost: 14000,      target: "cs",      need: ["cs", 10],      mult: 2 },
  { id: "g6", name: "Board calendar",     desc: "Secretaries, doubled.",              cost: 280000,     target: "cs",      need: ["cs", 25],      mult: 2 },
  { id: "g7", name: "Courier contract",   desc: "Branch offices, doubled.",           cost: 150000,     target: "branch",  need: ["branch", 10],  mult: 2 },
  { id: "g8", name: "Regional partner",   desc: "Branch offices, doubled.",           cost: 3000000,    target: "branch",  need: ["branch", 25],  mult: 2 },
  { id: "g9", name: "Bulk upload",        desc: "Filing software, doubled.",          cost: 1700000,    target: "soft",    need: ["soft", 10],    mult: 2 },
  { id: "g10", name: "Overnight batches", desc: "Filing software, doubled.",          cost: 34000000,   target: "soft",    need: ["soft", 25],    mult: 2 },
  { id: "g11", name: "Equity for juniors", desc: "Partners, doubled.",                cost: 24000000,   target: "partner", need: ["partner", 10], mult: 2 },
  { id: "g12", name: "Retainer model",    desc: "The calendar, doubled.",             cost: 400000000,  target: "cal",     need: ["cal", 10],     mult: 2 },

  { id: "a1", name: "ISO certification",  desc: "Everything earns 50% more.",         cost: 500000,     target: "all",     need: ["cs", 20],      mult: 1.5 },
  { id: "a2", name: "Named in the press", desc: "Everything earns double.",           cost: 60000000,   target: "all",     need: ["partner", 5],  mult: 2 }
];

/* Indian units all the way up. Arab is 10^9, and it keeps going from there. */
const UNITS = [[1e17, "Shankh"], [1e15, "Padma"], [1e13, "Neel"], [1e11, "Kharab"],
               [1e9, "Arab"], [1e7, "Cr"], [1e5, "L"], [1e3, "K"]];

/* ------------------------------------------------------------------- maths */

function fmt(n) {
  if (!isFinite(n)) return "∞";
  if (n >= 1e21) return n.toExponential(2);
  if (n < 1000) return n < 100 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toString();
  for (const [size, label] of UNITS) if (n >= size) return (n / size).toFixed(2) + " " + label;
  return Math.floor(n).toString();
}
const rupees = n => "₹" + fmt(n);

/* Cost of the next `count` of something already owned `owned` times. */
function bulkCost(base, owned, count) {
  return base * Math.pow(GROWTH, owned) * (Math.pow(GROWTH, count) - 1) / (GROWTH - 1);
}

/* How many more can be afforded with `money` — the inverse of bulkCost.
   The epsilon is for the boundary: floats land a hair under an exact price. */
function maxAffordable(base, owned, money) {
  const ratio = money * (GROWTH - 1) / (base * Math.pow(GROWTH, owned));
  return Math.max(0, Math.floor(Math.log(1 + ratio) / Math.log(GROWTH) + 1e-9));
}

/* Half rate while away, and never more than eight hours of it. */
function offlineGain(rate, seconds) {
  if (seconds < 60) return 0;
  return rate * Math.min(seconds, 8 * 3600) * 0.5;
}

/* Goodwill kept through a merge: the square root keeps late runs sane. */
function goodwillFrom(earned) {
  return Math.floor(Math.sqrt(earned / 1e8));
}

/* ------------------------------------------------------------------- state */

const fresh = () => ({
  money: 0, earned: 0, allTime: 0, clicks: 0,
  owned: {}, bought: {}, managers: {},
  goodwill: 0, merges: 0, last: Date.now()
});
let state = fresh();
let buyMode = "1";
let armed = null;

function multFor(target) {
  let m = 1;
  for (const u of UPGRADES) if (state.bought[u.id] && u.target === target) m *= u.mult;
  return m;
}
const prestigeMult = () => 1 + 0.02 * state.goodwill;
const income = () => GENS.reduce((sum, g) =>
  sum + (state.owned[g.id] || 0) * g.rate * multFor(g.id), 0) * multFor("all") * prestigeMult();
const clickValue = () => 1 * multFor("click") * multFor("all") * prestigeMult();

const unlocked = g => {
  const i = GENS.indexOf(g);
  return i === 0 || (state.owned[GENS[i - 1].id] || 0) > 0;
};
const upAvailable = u => {
  if (state.bought[u.id]) return false;
  const [what, n] = u.need;
  return (what === "click" ? state.clicks : (state.owned[what] || 0)) >= n;
};
function wanted(g) {
  const owned = state.owned[g.id] || 0;
  if (buyMode === "max") return Math.max(1, maxAffordable(g.cost, owned, state.money));
  return +buyMode;
}

/* ------------------------------------------------------------------ saving */

const SAVE = "empire-save";
function save() {
  state.last = Date.now();
  try { localStorage.setItem(SAVE, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE);
    if (!raw) return 0;
    const saved = JSON.parse(raw);
    state = Object.assign(fresh(), saved);
    const away = (Date.now() - (saved.last || Date.now())) / 1000;
    const gain = offlineGain(income(), away);
    state.money += gain;
    state.earned += gain;
    state.allTime += gain;
    return gain ? { gain, away } : 0;
  } catch (e) { return 0; }
}

/* --------------------------------------------------------------- rendering */

let toastTimer;
function toast(msg, ms = 2600) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
}

const rows = {};
let shownGens = "", shownUps = "";

function buildLists() {
  const gens = GENS.filter(unlocked);
  const ups = UPGRADES.filter(upAvailable);
  const gKey = gens.map(g => g.id).join(),
        uKey = ups.map(u => u.id).join();
  if (gKey === shownGens && uKey === shownUps) return;
  shownGens = gKey;
  shownUps = uKey;

  gensEl.innerHTML = "";
  for (const g of gens) {
    const wrap = document.createElement("div");
    wrap.className = "rowwrap";

    const b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    b.innerHTML = '<span class="chip">' + icon(g.id) + "</span>"
                + '<span class="grow"><span class="name"></span><span class="desc"></span></span>'
                + '<span class="num"><span class="cost"></span><span class="each"></span></span>';
    b.querySelector(".desc").textContent = g.desc;
    b._name = b.querySelector(".name");
    b._cost = b.querySelector(".cost");
    b._each = b.querySelector(".each");
    b.onclick = () => buy(g);
    rows[g.id] = b;

    const a = document.createElement("button");
    a.type = "button";
    a.className = "auto";
    a.onclick = () => hireManager(g);
    rows[g.id + ":auto"] = a;

    wrap.appendChild(b);
    wrap.appendChild(a);
    gensEl.appendChild(wrap);
  }

  upsEl.innerHTML = ups.length ? "" : '<p class="empty">Nothing yet. Keep filing.</p>';
  for (const u of ups) {
    const wrap = document.createElement("div");
    wrap.className = "rowwrap";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    b.innerHTML = '<span class="chip">' + icon("up") + "</span>"
                + '<span class="grow"><span class="name"></span><span class="desc"></span></span>'
                + '<span class="num"><span class="cost"></span></span>';
    b.querySelector(".name").textContent = u.name;
    b.querySelector(".desc").textContent = u.desc;
    b.querySelector(".cost").textContent = rupees(u.cost);
    b.onclick = () => buyUpgrade(u);
    rows[u.id] = b;
    wrap.appendChild(b);
    upsEl.appendChild(wrap);
  }
}

function paint() {
  moneyEl.textContent = fmt(state.money);
  rateEl.textContent = rupees(income()) + " per second";
  perClickEl.textContent = "+" + rupees(clickValue());

  for (const g of GENS) {
    const row = rows[g.id];
    if (!row || !unlocked(g)) continue;
    const owned = state.owned[g.id] || 0;
    const count = wanted(g);
    const cost = bulkCost(g.cost, owned, count);
    const label = g.name + (owned ? " <b>&times;" + owned + "</b>" : "");
    if (row._name.innerHTML !== label) row._name.innerHTML = label;
    row._cost.textContent = rupees(cost) + (count > 1 ? " · " + count : "");
    row._each.textContent = "+" + fmt(g.rate * multFor(g.id) * multFor("all") * prestigeMult()) + "/s each";
    row.disabled = state.money < cost;

    const auto = rows[g.id + ":auto"];
    const hired = !!state.managers[g.id];
    const mCost = managerCost(g);
    const label2 = hired ? "<b>AUTO</b>on" : "<b>AUTO</b>" + rupees(mCost);
    if (auto.innerHTML !== label2) auto.innerHTML = label2;
    auto.classList.toggle("on", hired);
    auto.disabled = hired || state.money < mCost;
    auto.setAttribute("aria-label", hired
      ? "Manager hired for " + g.name
      : "Hire a manager for " + g.name + ", " + rupees(mCost));
  }
  for (const u of UPGRADES) {
    const row = rows[u.id];
    if (row && upAvailable(u)) row.disabled = state.money < u.cost;
  }

  const gain = goodwillFrom(state.earned);
  mergeBtn.disabled = gain < 1;
  mergeBtn.textContent = gain < 1 ? "Merge at " + rupees(1e8) + " earned"
    : (armed === "merge" ? "Tap again to merge" : "Merge → +" + gain + " goodwill");
  statsEl.innerHTML = "Goodwill <b>" + state.goodwill + "</b> · +" + Math.round(state.goodwill * 2) + "% output"
    + "<br>Merges " + state.merges + " · filed by hand " + state.clicks
    + "<br>All time " + rupees(state.allTime);
}

/* ----------------------------------------------------------------- actions */

function buy(g) {
  const owned = state.owned[g.id] || 0;
  const count = wanted(g);
  const cost = bulkCost(g.cost, owned, count);
  if (state.money < cost) return;
  state.money -= cost;
  state.owned[g.id] = owned + count;
  buildLists();
  paint();
}

function buyUpgrade(u) {
  if (state.money < u.cost) return;
  state.money -= u.cost;
  state.bought[u.id] = true;
  buildLists();
  paint();
}

function hireManager(g) {
  const cost = managerCost(g);
  if (state.managers[g.id] || state.money < cost) return;
  state.money -= cost;
  state.managers[g.id] = true;
  paint();
  save();
  toast("A manager now hires for " + g.name + ", so you never have to.");
}

/* Managers buy one of their own tier per tick, whenever the money is there. */
function runManagers() {
  let bought = false;
  for (const g of GENS) {
    if (!state.managers[g.id]) continue;
    const owned = state.owned[g.id] || 0;
    const cost = bulkCost(g.cost, owned, 1);
    if (state.money < cost) continue;
    state.money -= cost;
    state.owned[g.id] = owned + 1;
    bought = true;
  }
  if (bought) buildLists();
}

function merge() {
  const gain = goodwillFrom(state.earned);
  if (gain < 1) return;
  if (armed !== "merge") {
    armed = "merge";
    paint();
    return toast("Merging wipes the office, managers included. Tap again.");
  }
  const keep = { goodwill: state.goodwill + gain, merges: state.merges + 1, allTime: state.allTime };
  state = Object.assign(fresh(), keep);
  armed = null;
  shownGens = shownUps = "";
  buildLists();
  paint();
  save();
  toast("Merged. +" + gain + " goodwill, kept for good.");
}

function wipe() {
  if (armed !== "wipe") { armed = "wipe"; return toast("This erases everything, goodwill included. Tap Reset again."); }
  try { localStorage.removeItem(SAVE); } catch (e) {}
  state = fresh();
  armed = null;
  shownGens = shownUps = "";
  buildLists();
  paint();
  toast("Back to an empty desk.");
}

/* ------------------------------------------------------------------ wiring */

const moneyEl = document.getElementById("money");
const rateEl = document.getElementById("rate");
const perClickEl = document.getElementById("perClick");
const gensEl = document.getElementById("gens");
const upsEl = document.getElementById("ups");
const statsEl = document.getElementById("stats");
const toastEl = document.getElementById("toast");

fileBtn.onclick = () => {
  const v = clickValue();
  state.money += v;
  state.earned += v;
  state.allTime += v;
  state.clicks++;
  buildLists();
  paint();
};
mergeBtn.onclick = merge;
wipeBtn.onclick = wipe;
document.addEventListener("click", e => {
  if (armed && !e.target.closest("#mergeBtn, #wipeBtn")) { armed = null; paint(); }
}, true);

for (const b of document.querySelectorAll(".modes button")) {
  b.onclick = () => {
    buyMode = b.dataset.mode;
    document.querySelectorAll(".modes button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    paint();
  };
}

const PAGE_BG = { dark: "#1b130c", light: "#d6c4a2" };
function setTheme(t, persist) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = PAGE_BG[t];
  themeBtn.textContent = t === "dark" ? "◐" : "◑";
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  if (persist) { try { localStorage.setItem("empire-theme", t); } catch (e) {} }
}
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
setTheme(document.documentElement.dataset.theme, false);

let last = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = Math.min((now - last) / 1000, 60);   /* a slept laptop should not pay out */
  last = now;
  const gain = income() * dt;
  state.money += gain;
  state.earned += gain;
  state.allTime += gain;
  runManagers();
  paint();
}, 100);
setInterval(save, 5000);
addEventListener("visibilitychange", () => { if (document.hidden) save(); });
addEventListener("pagehide", save);

/* Self-check: open index.html#test and read the console. */
function selfCheck() {
  const near = (a, b, name) => console.assert(Math.abs(a - b) < 0.01, name, a, b);
  const eq = (a, b, name) => console.assert(a === b, name, a);
  near(bulkCost(15, 0, 1), 15, "one costs base");
  near(bulkCost(15, 0, 2), 15 + 15 * 1.15, "two is base plus base times growth");
  near(bulkCost(15, 3, 1), 15 * Math.pow(1.15, 3), "owning three raises the next price");
  eq(maxAffordable(15, 0, 14), 0, "cannot afford one");
  eq(maxAffordable(15, 0, 15), 1, "exactly one");
  eq(maxAffordable(15, 0, bulkCost(15, 0, 7)), 7, "max matches what bulk costs");
  eq(maxAffordable(15, 0, bulkCost(15, 0, 7) - 0.01), 6, "a paisa short buys one fewer");
  eq(offlineGain(10, 30), 0, "under a minute away pays nothing");
  near(offlineGain(10, 3600), 10 * 3600 * 0.5, "half rate while away");
  near(offlineGain(10, 99999), 10 * 8 * 3600 * 0.5, "capped at eight hours");
  eq(goodwillFrom(1e8), 1, "first goodwill at ten crore");
  eq(goodwillFrom(1e10), 10, "ten at a hundred times that");
  eq(managerCost({ cost: 15 }), 1800, "a manager costs 120 of its tier");
  eq(fmt(999), "999", "plain below a thousand");
  eq(fmt(1234), "1.23 K", "thousands");
  eq(fmt(1e5), "1.00 L", "lakh");
  eq(fmt(2.5e7), "2.50 Cr", "crore");
  eq(fmt(1e9), "1.00 Arab", "arab");
  eq(fmt(1e13), "1.00 Neel", "neel");
  console.log("self-check done");
}

const offline = load();
buildLists();
paint();
if (offline) {
  awayAmount.textContent = rupees(offline.gain);
  const hrs = offline.away / 3600;
  awayFor.textContent = hrs >= 8 ? "Eight hours' worth. That is the cap."
    : hrs >= 1 ? "About " + Math.round(hrs) + " hour" + (Math.round(hrs) === 1 ? "" : "s") + " of it."
    : Math.round(offline.away / 60) + " minutes of it.";
  away.showModal();
}
awayBtn.onclick = () => away.close();
if (location.hash === "#test") selfCheck();
</script>
